services:
  - type: web
    name: matchmind
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: replay
      - key: ALLOW_LIVE_GENERATION
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
