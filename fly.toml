app = "matchmind"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[checks.health]
  type = "http"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[env]
  DEMO_MODE = "replay"
  ALLOW_LIVE_GENERATION = "false"
